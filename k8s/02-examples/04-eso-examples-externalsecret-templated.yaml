# -----------------------------------------------------------------------------
# Exemplo 3: usar template para compor um valor derivado (ex.: connection string
# ou um arquivo de config) a partir de secrets individuais do Vaultwarden.
#
# Pre-requisito no Vaultwarden: itens "PG_USER", "PG_PASSWORD", "PG_HOST",
# "PG_DBNAME" na coleção "eso-demo".
#
# Resultado: Secret "app-dsn" com:
#   - DATABASE_URL: postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require
#   - app.properties: arquivo de config renderizado
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-dsn
  namespace: eso-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden-api
    kind: ClusterSecretStore
  target:
    name: app-dsn
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .user }}:{{ .password }}@{{ .host }}:5432/{{ .dbname }}?sslmode=require"
        app.properties: |
          spring.datasource.url=jdbc:postgresql://{{ .host }}:5432/{{ .dbname }}
          spring.datasource.username={{ .user }}
          spring.datasource.password={{ .password }}
  data:
    - secretKey: user
      remoteRef:
        key: PG_USER
        property: eso-demo
    - secretKey: password
      remoteRef:
        key: PG_PASSWORD
        property: eso-demo
    - secretKey: host
      remoteRef:
        key: PG_HOST
        property: eso-demo
    - secretKey: dbname
      remoteRef:
        key: PG_DBNAME
        property: eso-demo
