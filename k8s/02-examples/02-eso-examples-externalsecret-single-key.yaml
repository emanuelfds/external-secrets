# -----------------------------------------------------------------------------
# Exemplo 1: puxar um unico secret do Vaultwarden.
#
# Pre-requisito no Vaultwarden: exista um item de login chamado "DATABASE_URL"
# cujo campo Password contenha o valor desejado, na coleção "eso-demo".
#
# Resultado: cria o Secret "app-database" no namespace eso-demo com a chave
# `DATABASE_URL`.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-database
  namespace: eso-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden-api
    kind: ClusterSecretStore
  target:
    name: app-database            # nome do Secret k8s gerado
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL      # chave dentro do Secret k8s
      remoteRef:
        key: DATABASE_URL          # nome do item no Vaultwarden
        property: eso-demo         # nome da coleção no Vaultwarden
