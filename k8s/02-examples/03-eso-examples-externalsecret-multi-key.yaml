# -----------------------------------------------------------------------------
# Exemplo 2: montar um unico Secret k8s a partir de varios itens do Vaultwarden.
#
# Pre-requisito no Vaultwarden: itens "APP_DB_USER", "APP_DB_PASSWORD" e
# "APP_JWT_SECRET" na coleção "eso-demo".
#
# Resultado: Secret "app-config" com tres chaves, consumivel via envFrom.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: eso-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden-api
    kind: ClusterSecretStore
  target:
    name: app-config
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: APP_DB_USER
        property: eso-demo
    - secretKey: DB_PASSWORD
      remoteRef:
        key: APP_DB_PASSWORD
        property: eso-demo
    - secretKey: JWT_SECRET
      remoteRef:
        key: APP_JWT_SECRET
        property: eso-demo
