# -----------------------------------------------------------------------------
# Credenciais que o provider webhook usa para autenticar no vaultwarden-api.
#
# O ClusterSecretStore precisa que este Secret exista em um namespace fixo
# (aqui: external-secrets) e que carregue o label:
#     external-secrets.io/type: webhook
# sem o qual o ESO recusa a leitura do Secret.
#
# A chave `api-key` deve conter o MESMO valor da chave `API_KEY` presente no
# Secret `s-vaultwarden-api-credentials` (namespace vaultwarden), que a
# aplicacao vaultwarden-api usa para validar o header Authorization: Bearer.
#
# NAO comite o valor real. Preencha via um dos metodos abaixo:
#
#   # 1) A partir do Secret existente no cluster:
#   API_KEY=$(kubectl get secret s-vaultwarden-api-credentials -n vaultwarden \
#     -o jsonpath='{.data.API_KEY}' | base64 -d)
#   kubectl create secret generic s-vaultwarden-api-webhook-credentials \
#     -n external-secrets \
#     --from-literal=api-key="$API_KEY" \
#     --dry-run=client -o yaml | \
#     kubectl label --local -f - external-secrets.io/type=webhook -o yaml | \
#     kubectl apply -f -
#
#   # 2) Ou edite o stringData abaixo e aplique (menos seguro):
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: s-vaultwarden-api-webhook-credentials
  namespace: external-secrets
  labels:
    # Obrigatorio: sem este label o webhook nao consegue ler o Secret.
    external-secrets.io/type: webhook
    app.kubernetes.io/part-of: external-secrets-operator
    app.kubernetes.io/component: webhook-credentials
type: Opaque
stringData:
  # Substitua pelo valor real da API_KEY do vaultwarden-api.
  api-key: "REPLACE_WITH_VAULTWARDEN_API_KEY"
