# -----------------------------------------------------------------------------
# ClusterSecretStore (escopo global do cluster) que fala com o vaultwarden-api
# usando o provider generico "webhook".
#
# Fluxo:
#   ExternalSecret.remoteRef.key      -> {{ .remoteRef.key }} na URL
#   ExternalSecret.remoteRef.property  -> {{ .remoteRef.property }} na query
#   GET http://svc-vaultwarden-api.vaultwarden.svc.cluster.local:8080/secret/<key>?collection_name=<collection>
#   Header: Authorization: Bearer <api-key>
#   Resposta JSON: {"name":"<key>","value":"<secret>"}  ->  result.jsonPath: $.value
#
# Observacoes:
#   - A comunicacao e HTTP interno no cluster (ClusterIP). O trafego nao sai do
#     cluster. Se quiser TLS ponta a ponta, exponha o vaultwarden-api via HTTPS
#     e ajuste a url + caProvider/caBundle.
#   - Um retorno HTTP 404 do endpoint faz o ESO considerar o secret "deletado"
#     e aplica a deletionPolicy do ExternalSecret.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-api
  labels:
    app.kubernetes.io/part-of: external-secrets-operator
spec:
  provider:
    webhook:
      # O namespace de coleção do Vaultwarden é passado por remoteRef.property.
      url: "http://svc-vaultwarden-api.vaultwarden.svc.cluster.local:8080/secret/{{ .remoteRef.key }}?collection_name={{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      result:
        # O vaultwarden-api responde {"name": "...", "value": "..."}.
        jsonPath: "$.value"
      headers:
        Accept: "application/json"
        # Os valores do Secret sao expostos como .<name>.<chaveNoSecret>.
        # A chave "api-key" tem hifen, entao usamos `index` (Go template).
        Authorization: "Bearer {{ index .creds \"api-key\" }}"
      secrets:
        - name: creds
          secretRef:
            name: s-vaultwarden-api-webhook-credentials
            namespace: external-secrets
