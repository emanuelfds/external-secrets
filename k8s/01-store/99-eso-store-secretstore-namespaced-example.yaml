# -----------------------------------------------------------------------------
# ALTERNATIVA (opcional): SecretStore com escopo de namespace.
#
# Use isto quando quiser isolar o acesso ao vaultwarden-api por namespace em vez
# de um ClusterSecretStore global. Neste caso, o Secret de credenciais precisa
# existir NO MESMO namespace do SecretStore (e do ExternalSecret) e o campo
# `namespace` em secretRef e omitido.
#
# Este arquivo NAO faz parte do kustomize base; e um modelo para copiar.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-api-webhook-credentials
  namespace: my-app          # <- ajuste para o namespace da sua aplicacao
  labels:
    external-secrets.io/type: webhook
type: Opaque
stringData:
  api-key: "REPLACE_WITH_VAULTWARDEN_API_KEY"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vaultwarden-api
  namespace: my-app          # <- mesmo namespace da aplicacao
spec:
  provider:
    webhook:
      url: "http://svc-vaultwarden-api.vaultwarden.svc.cluster.local:8080/secret/{{ .remoteRef.key }}"
      method: GET
      timeout: 10s
      result:
        jsonPath: "$.value"
      headers:
        Accept: "application/json"
        Authorization: "Bearer {{ index .creds \"api-key\" }}"
      secrets:
        - name: creds
          secretRef:
            # Em SecretStore (namespaced) nao se informa namespace aqui.
            name: vaultwarden-api-webhook-credentials
